# Custom sequences sent by Ghostty and WezTerm for Command-[ and Command-].
set -s user-keys[0] "\033[5;30012~"
set -s user-keys[1] "\033[5;30013~"

# Cycle through panes without the tmux prefix.
bind-key -n User0 select-pane -t :.-
bind-key -n User1 select-pane -t :.+

# Preserve modified keys such as Shift-Enter through tmux.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'
set -as terminal-features ',xterm*:extkeys'

# WezTerm uses xterm-256color and supports true-color output.
set -as terminal-features ',xterm-256color:RGB'

# Notify terminal applications when focus moves between tmux panes.
set -g focus-events on

# Show the tmux session name in the terminal tab title.
set -g set-titles on
set -g set-titles-string '#S'

# Use Vim-style keys in copy mode and start selecting with v.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# TokyoNight-inspired pane borders.
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# TokyoNight-inspired status bar.
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-right-style "bg=#1a1b26,fg=#a9b1d6"
set -g window-status-style "bg=#1a1b26,fg=#a9b1d6"
set -g window-status-current-style "bg=#1a1b26,fg=#a9b1d6,bold"
